name: Set up Rocq
description: Install Rocq through opam
author: Tej Chajed

# Add your action's branding here. This will appear on the GitHub Marketplace.
branding:
  icon: package
  color: red

# Define your inputs here.
inputs:
  rocq-version:
    description:
      'The version of Rocq to install (latest, weekly, dev, or full version like
      9.1.0)'
    default: 'latest'
  opam-repositories:
    description: 'Additional opam repositories to add (YAML name:url object)'
    required: false
    default: ''
  cache-key-opam-files:
    description:
      'Opam files to use for cache key. Separate patterns with newlines.'
    required: false
    default: '*.opam'
  save-if:
    description:
      'Whether to save the cache in the post step: "true", "false", or "auto"
      (the default), which saves on every event except pull_request. A cache
      saved by a pull_request run is scoped to that PR and is invisible to every
      other branch, so it can only evict shared caches, never be reused by them.
      Set to "true" if your workflow never runs on a branch (e.g. `on:
      pull_request` only), otherwise no cache will ever be populated.'
    required: false
    default: 'auto'
  strip-binary-annotations:
    description:
      'Delete .cmt/.cmti files from the switch before saving the cache. These
      are read by merlin, ocaml-lsp and odoc but by nothing that builds a Rocq
      project, and they are roughly a fifth of the compressed cache. Set to
      "false" if your workflow runs those tools against the switch.'
    required: false
    default: 'true'
  ocaml-version:
    description:
      'The version of the OCaml compiler to install in the opam switch. Rocq 8.x
      requires an OCaml 4.x compiler.'
    required: false
    default: '5.4.0'
  dune-version:
    description:
      'The dune version installed before Rocq, as a floor rather than a pin: a
      restored switch whose dune is already at least this version keeps it. Set
      this to the dune your project requires. Otherwise Rocq is built against
      the default dune and your `opam install` upgrades dune afterwards, which
      recompiles all of Rocq.'
    required: false
    default: '3.22.1'

outputs:
  cache-hit:
    description: 'Whether an opam cache was restored ("true" or "false")'
  cache-primary-key:
    description: 'The cache key this run computed and would save under'
  cache-matched-key:
    description:
      'The key of the cache that was actually restored. Differs from
      cache-primary-key when a fallback prefix matched; empty on a miss.'
  rocq-version:
    description:
      'The Rocq version actually installed, as reported by opam. Empty if it
      could not be determined.'
  ocaml-version:
    description: 'The OCaml version installed in the switch'
  opam-switch-prefix:
    description: 'The prefix of the opam switch Rocq was installed into'

runs:
  using: node24
  main: dist/index.js
  post: dist/post.js
  # always(), not success(): a job whose build fails after a successful Rocq
  # install should still save the cache, since that is exactly the case where
  # rebuilding from scratch is most expensive.  saveCache() itself refuses to
  # run unless the main action recorded that setup completed, so a switch left
  # half-built by a failed setup is never saved.
  post-if: always()
