name: Set up Rocq
description: Install Rocq through opam
author: Tej Chajed

# Add your action's branding here. This will appear on the GitHub Marketplace.
branding:
  icon: package
  color: red

# Define your inputs here.
inputs:
  rocq-version:
    description:
      'The version of Rocq to install (latest, weekly, dev, or full version like
      9.1.0)'
    default: 'latest'
  opam-repositories:
    description: 'Additional opam repositories to add (YAML name:url object)'
    required: false
    default: ''
  cache-key-opam-files:
    description:
      'Opam files to use for cache key. Separate patterns with newlines.'
    required: false
    default: '*.opam'
  save-if:
    description:
      'Whether to save the cache in the post step: "true", "false", or "auto"
      (the default), which saves on every event except pull_request. A cache
      saved by a pull_request run is scoped to that PR and is invisible to every
      other branch, so it can only evict shared caches, never be reused by them.
      Set to "true" if your workflow never runs on a branch (e.g. `on:
      pull_request` only), otherwise no cache will ever be populated.'
    required: false
    default: 'auto'
  strip-binary-annotations:
    description:
      'Delete .cmt/.cmti files from the switch before saving the cache. These
      are read by merlin, ocaml-lsp and odoc but by nothing that builds a Rocq
      project, and they are roughly a fifth of the compressed cache. Set to
      "false" if your workflow runs those tools against the switch.'
    required: false
    default: 'true'

runs:
  using: node24
  main: dist/index.js
  post: dist/post.js
  post-if: success()
